[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrogen"
version = "1.0.0"
description = "VLM-based game playing agent"
readme = "README.md"
requires-python = ">=3.10"

# Default: everything
dependencies = [
    # Shared
    "numpy",
    "pyzmq",
    
    # Serve
    "torch",
    "pyyaml",
    "einops",
    "transformers",
    "pydantic",
    "diffusers",
    "polars",
    
    # Play (Windows-only deps marked)
    "pillow",
    "opencv-python",
    "pyautogui",
    "gymnasium",
    "psutil",
    "av",
    "dxcam; sys_platform == 'win32'",
    "pywinctl; sys_platform == 'win32'",
    "vgamepad; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    "xspeedhack; sys_platform == 'win32'",
]

[project.optional-dependencies]
serve = [
    "numpy",
    "pyzmq",
    "torch",
    "pyyaml",
    "einops",
    "transformers",
    "pydantic",
    "diffusers",
    "polars",
]

play = [
    "numpy",
    "pyzmq",
    "pillow",
    "opencv-python",
    "pyautogui",
    "gymnasium",
    "psutil",
    "av",
    "dxcam",
    "pywinctl",
    "vgamepad",
    "pywin32",
    "xspeedhack",
]

# Headless Linux eval/record harness + data bootstrapping (record server, emulator envs, YouTube
# farming, VLM objective labels). Adds the deps the planner_poc/ tooling needs beyond the core.
# Also requires system packages: Xvfb, ffmpeg, xdotool, matchbox-window-manager (apt), a JS runtime
# (deno) for YouTube, and per-game build toolchains. See docs/SETUP_EVAL.md.
eval = [
    "mss",                  # fast in-process X11 frame grab for the record server
    "yt-dlp",               # YouTube gameplay farming (with cookies + deno EJS)
    "stable-retro",         # in-process SNES/Genesis/NES emulator envs (frame-exact save/load)
    "pygba",                # in-process GB/GBC/GBA (mGBA) emulator envs
    "opencv-python",        # frame/optical-flow analysis
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["scripts*"]